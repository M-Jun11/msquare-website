# main に push（GitHub の画面でのアップロードを含む）するか、手動で実行すると、
# 公開用のファイルだけを Cloudflare Pages（msquare-website）の本番にデプロイする。
# secrets: CLOUDFLARE_API_TOKEN（msquare アカウントの Cloudflare Pages:Edit のみ）、CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          for f in index.html 404.html _headers _redirects robots.txt sitemap.xml favicon.ico favicon.png news.json news.js news.css; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          if [ -d images ]; then cp -r images _site/; fi
          if [ -d news ]; then cp -r news _site/; fi
          test -f _site/index.html
          ls -R _site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          npx --yes wrangler@4 pages deploy _site \
            --project-name msquare-website --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-200)" \
            --commit-dirty=false
